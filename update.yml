---
- name: Update all WSL distributions
  hosts: all
  gather_facts: false

  tasks:
    - name: Ensure python3-apt is installed
      raw: apt-get install -y python3-apt
      changed_when: false
      check_mode: false

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Upgrade all packages
      apt:
        upgrade: dist
      register: upgrade_result

    - name: Display upgraded packages
      debug:
        msg: "{{ upgrade_result.stdout_lines | default(['No changes']) }}"
      when: upgrade_result.changed
